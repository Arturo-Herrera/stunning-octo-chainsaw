<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TJ Route Admin - Dark Edition</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet-routing-machine@latest/dist/leaflet-routing-machine.css" />

    <style>
        /* Personalización para modo oscuro del mapa */
        .leaflet-layer, .leaflet-control-zoom-in, .leaflet-control-zoom-out, .leaflet-control-attribution {
            filter: invert(100%) hue-rotate(180deg) brightness(95%) contrast(90%);
        }
        #map { height: 100vh; width: 100%; z-index: 1; }
        
        /* Ocultar el panel de instrucciones por defecto de Leaflet para usar nuestra propia UI */
        .leaflet-routing-container { display: none; }

        /* Scrollbar personalizada para el panel */
        ::-webkit-scrollbar { width: 5px; }
        ::-webkit-scrollbar-track { background: #1f2937; }
        ::-webkit-scrollbar-thumb { background: #7c3aed; border-radius: 10px; }
    </style>
</head>
<body class="bg-[#0f172a] text-gray-100 overflow-hidden flex h-screen">

    <aside class="w-80 bg-[#1e1b4b] border-r border-purple-900/50 flex flex-col z-[1001] shadow-2xl">
        <div class="p-6">
            <h1 class="text-2xl font-bold text-purple-400 mb-2">TJ <span class="text-white">Routes</span></h1>
            <p class="text-xs text-purple-300/60 uppercase tracking-widest font-semibold">Panel de Control</p>
        </div>

        <nav class="flex-1 overflow-y-auto p-4 space-y-6">
            <div>
                <h2 class="text-sm font-semibold text-gray-400 mb-3 px-2">RUTAS FRECUENTES</h2>
                <div class="space-y-2">
                    <button onclick="setRoute('sanYsidro')" class="w-full flex items-center p-3 rounded-lg bg-gray-800/50 hover:bg-purple-600/30 border border-gray-700 hover:border-purple-500 transition-all group">
                        <div class="p-2 bg-purple-900/50 rounded-md mr-3 group-hover:bg-purple-500">📍</div>
                        <div class="text-left">
                            <p class="text-sm font-medium">Garita San Ysidro</p>
                            <p class="text-[10px] text-gray-400">Vía Rápida Poniente</p>
                        </div>
                    </button>

                    <button onclick="setRoute('otay')" class="w-full flex items-center p-3 rounded-lg bg-gray-800/50 hover:bg-purple-600/30 border border-gray-700 hover:border-purple-500 transition-all group">
                        <div class="p-2 bg-purple-900/50 rounded-md mr-3 group-hover:bg-purple-500">🏢</div>
                        <div class="text-left">
                            <p class="text-sm font-medium">UABC / Otay</p>
                            <p class="text-[10px] text-gray-400">Blvd. Altabrisa</p>
                        </div>
                    </button>

                    <button onclick="setRoute('santaFe')" class="w-full flex items-center p-3 rounded-lg bg-gray-800/50 hover:bg-purple-600/30 border border-gray-700 hover:border-purple-500 transition-all group">
                        <div class="p-2 bg-purple-900/50 rounded-md mr-3 group-hover:bg-purple-500">🏘️</div>
                        <div class="text-left">
                            <p class="text-sm font-medium">Santa Fe</p>
                            <p class="text-[10px] text-gray-400">Carr. Libre a Rosarito</p>
                        </div>
                    </button>
                </div>
            </div>

            <div id="routeInfo" class="hidden animate-pulse">
                <div class="p-4 bg-purple-900/20 border border-purple-500/30 rounded-xl">
                    <p class="text-xs text-purple-400 font-bold mb-1">DETALLES DEL VIAJE</p>
                    <div class="flex justify-between items-center">
                        <span id="distancia" class="text-lg font-mono">0.0 km</span>
                        <span id="tiempo" class="text-sm text-gray-300 font-light">0 mins</span>
                    </div>
                </div>
            </div>
        </nav>

        <div class="p-4 bg-[#131139]">
            <button onclick="resetMap()" class="w-full py-2 bg-gray-800 hover:bg-red-900/40 text-gray-400 hover:text-red-300 text-xs rounded transition-colors border border-gray-700">
                Limpiar Mapa
            </button>
        </div>
    </aside>

    <main class="flex-1 relative">
        <div id="map"></div>
    </main>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://unpkg.com/leaflet-routing-machine@latest/dist/leaflet-routing-machine.js"></script>

    <script>
        // Coordenadas predefinidas de Tijuana
        const locations = {
            sanYsidro: [32.5400, -117.0277],
            otay: [32.5317, -116.9482],
            santaFe: [32.4490, -117.0370],
            zonaRio: [32.5283, -117.0211]
        };

        // Inicializar mapa
        const map = L.map('map', { zoomControl: false }).setView(locations.zonaRio, 13);
        L.control.zoom({ position: 'bottomright' }).addTo(map);

        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);

        // Control de enrutamiento con estilos personalizados
        const routingControl = L.Routing.control({
            waypoints: [],
            lineOptions: {
                styles: [
                    { color: '#a855f7', opacity: 0.8, weight: 8 }, // Línea neón morada
                    { color: '#ffffff', opacity: 0.4, weight: 2 }  // Brillo central
                ]
            },
            createMarker: function(i, wp) {
                return L.marker(wp.latLng, {
                    draggable: true,
                    icon: L.divIcon({
                        className: 'bg-purple-500 w-4 h-4 rounded-full border-2 border-white shadow-lg shadow-purple-500/50',
                        iconSize: [16, 16]
                    })
                });
            },
            addWaypoints: true,
            language: 'es'
        }).addTo(map);

        // Escuchar eventos de la ruta para actualizar la UI
        routingControl.on('routesfound', function(e) {
            const routes = e.routes;
            const summary = routes[0].summary;
            
            document.getElementById('routeInfo').classList.remove('hidden');
            document.getElementById('distancia').innerText = (summary.totalDistance / 1000).toFixed(1) + " km";
            document.getElementById('tiempo').innerText = Math.round(summary.totalTime / 60) + " min aprox.";
        });

        // Función para cambiar ruta desde la interfaz
        function setRoute(destKey) {
            const start = locations.zonaRio; // Punto de origen fijo por ahora
            const end = locations.destKey || locations[destKey];
            
            routingControl.setWaypoints([
                L.latLng(start),
                L.latLng(end)
            ]);
            
            // Centrar mapa
            map.flyTo(end, 14);
        }

        function resetMap() {
            routingControl.setWaypoints([]);
            document.getElementById('routeInfo').classList.add('hidden');
            map.flyTo(locations.zonaRio, 13);
        }
    </script>
</body>
</html>
